[project]
name = "fraud-loop"
version = "0.1.0"
description = "Fraud review loop: LightGBM, cost threshold, analyst cases, monitoring, retrain gate."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "joblib>=1.4",
  "lightgbm>=4.5",
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=17",
  "python-dotenv>=1.0",
  "pydantic>=2.8",
  "scikit-learn>=1.5",
  "scipy>=1.13",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
train = ["mlflow>=3", "optuna>=4", "xgboost>=3"]

[dependency-groups]
dev = ["playwright>=1.50", "pytest>=8", "pytest-cov>=6", "ruff>=0.6"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501", "F401"]

[tool.coverage.run]
source = ["src/fraud"]
omit = [
  "src/fraud/train.py",
  "src/fraud/finalize.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
