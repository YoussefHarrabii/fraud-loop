name: ci

on:
  push:
  pull_request:

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No tracked secret files
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)|(^|/)secrets/'; then
            echo "secret file is tracked"
            exit 1
          fi
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install
        run: uv sync --frozen --all-groups
      - name: Lint
        run: uv run ruff check src tests scripts
      - name: Test
        run: uv run pytest --cov

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build dependency layer
        run: docker build --target base -t fraud-loop:base .

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install
        run: uv sync --frozen --all-groups
      - name: Install browser
        run: uv run playwright install --with-deps chromium
      - name: Browser test
        run: RUN_UI=1 uv run pytest tests/test_ui_e2e.py -q
