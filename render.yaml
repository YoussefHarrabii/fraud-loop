services:
  - type: web
    name: fraud-loop
    runtime: docker
    dockerfilePath: ./Dockerfile.deploy
    plan: free
    region: frankfurt
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: OPENCODE_MODEL
        value: deepseek-v4.1-flash
      - key: LLM_DAILY_CAP
        value: "40"
      # Set the value in the Render dashboard. `sync: false` keeps it out of this
      # file, out of git and out of the image.
      - key: OPENCODE_KEY
        sync: false
